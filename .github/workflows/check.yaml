name: Check PD
on: [push, pull_request]
concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true
jobs:
  statics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - uses: ./.github/actions/setup-go
        id: go
        with:
          cache-scope: check
      - name: Restore linter cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/golangci-lint
          key: golangci-lint-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('Makefile', 'tools.go', '**/go.mod', '**/go.sum', '**/.golangci.*') }}-${{ github.sha }}
          restore-keys: |
            golangci-lint-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('Makefile', 'tools.go', '**/go.mod', '**/go.sum', '**/.golangci.*') }}-
      - name: Make Check
        run: |
          SWAGGER=1 make build
          make tools
          make check
