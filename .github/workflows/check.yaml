name: Check PD
on: [push, pull_request]
concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true
jobs:
  statics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - uses: ./.github/actions/setup-go
        with:
          cache-scope: check
      - name: Make Check
        run: |
          python3 -m unittest discover -s scripts -p test_ci_shard.py
          SWAGGER=1 make build
          make tools
          make check
