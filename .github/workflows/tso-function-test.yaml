name: TSO Function Test
on:
  push:
    branches:
      - master
      - release-5.*
      - release-6.*
      - release-7.*
      - release-8.*
      - release-nextgen-*
  pull_request:
    branches:
      - master
      - release-5.*
      - release-6.*
      - release-7.*
      - release-8.*
      - release-nextgen-*
concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true
jobs:
  tso-function-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - uses: ./.github/actions/setup-go
        with:
          cache-scope: tso-function
      - name: Make TSO Function Test
        run: make test-tso-function
